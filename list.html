<html>
<head>
  <title>Horizontal List</title>
  <style>
    ul {
      list-style-type: none; 
      padding: 0;
      margin: 0;
    }

    li {
      display: inline-block; 
      margin-right: 20px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <ul>
    <li>Home</li>
    <li>About</li>
    <li>Services</li>
    <li>Contact</li>
  </ul>
</body>
</html>
